{% extends "procurement/base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="panel">
    <h2>{{ page_title }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save and Continue</button>
        <a class="button secondary" href="{% url 'prescriptions:dashboard' %}">Cancel</a>
    </form>
</div>
{% endblock %}
