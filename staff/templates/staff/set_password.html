
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate HPMS Account</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            padding: 40px 15px;
        }

        .container {
            max-width: 480px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            box-sizing: border-box;
        }

        button {
            background: #1456a0;
            color: white;
            border: none;
            padding: 13px;
            width: 100%;
            cursor: pointer;
        }

        .errorlist {
            color: #b42318;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Activate Your HPMS Account</h2>

    <p>Create a secure password for your staff account.</p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Set Password and Activate Account
        </button>

    </form>

</div>

</body>
</html>
